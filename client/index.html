<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minescape</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>

    <div id="start">
      <div class="start-card">
        <h1>MINESCAPE</h1>
        <p>A RuneScape × Minecraft sandbox for you and up to 7 friends.</p>
        <input id="name" maxlength="16" placeholder="Character name" autocomplete="off" />
        <input id="password" type="password" maxlength="32" placeholder="Password (optional)" autocomplete="off" />
        <div class="start-hint">Use the same name + password each time to keep your character. Leave password blank for a quick character.</div>
        <div class="skin-label">Choose your look</div>
        <div id="skin-body" class="swatches"></div>
        <div id="skin-head" class="swatches"></div>
        <button id="play">Enter the world</button>
        <div id="start-error"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
